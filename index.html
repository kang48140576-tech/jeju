<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 제주 브로슈어</title>
<style>
  /* 기본 배경 및 정렬 설정 */
  body { 
    margin: 0; 
    overflow: hidden; 
    background-color: #f3f4f6; 
    font-family: sans-serif; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    height: 100vh; 
  }
  
  /* 3D 원근감을 주는 카메라 공간 */
  .scene {
    width: 840px; /* 280px * 3면 */
    height: 560px;
    perspective: 1500px;
    position: relative;
    cursor: grab;
  }
  .scene:active { cursor: grabbing; }

  /* 브로슈어 전체 그룹 */
  .brochure {
    width: 280px;
    height: 560px;
    position: absolute;
    top: 0;
    left: 280px; /* 가운데 정렬을 위해 왼쪽에서 1칸 띄움 */
    transform-style: preserve-3d;
    transform: rotateX(-5deg) rotateY(0deg); /* 처음 약간 위에서 내려다보는 각도 */
    transition: transform 0.1s ease-out; /* 마우스 드래그 시 부드럽게 */
  }

  /* 각각의 패널 기본 속성 */
  .panel {
    width: 280px;
    height: 560px;
    position: absolute;
    top: 0;
    transform-style: preserve-3d;
    transition: transform 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .panel-center {
    left: 0;
  }

  .panel-left {
    left: -280px;
    transform-origin: right center; /* 오른쪽 모서리를 기준으로 회전 */
  }

  .panel-right {
    left: 280px;
    transform-origin: left center; /* 왼쪽 모서리를 기준으로 회전 */
  }

  /* ====== 접었을 때(삼각기둥)의 애니메이션 ====== */
  /* 바깥으로 120도씩 꺾여서 3면이 맞물림 */
  .brochure.is-folded .panel-left {
    transform: rotateY(-120deg);
  }
  
  .brochure.is-folded .panel-right {
    transform: rotateY(120deg);
  }

  /* 패널의 앞면/뒷면 속성 */
  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden; /* 뒷면은 투과되어 보이지 않게 처리 */
    box-sizing: border-box;
    border: 1px solid rgba(0,0,0,0.1);
  }

  /* 이미지 (바깥쪽 면) */
  .face.front {
    background-size: 100% 100%; /* 이미지가 잘리지 않고 꽉 차게 */
    background-repeat: no-repeat;
    background-position: center;
  }

  /* 딥그린 (안쪽 면) */
  .face.back {
    background-color: #064e3b; /* 요청하신 딥그린 색상 */
    transform: rotateY(180deg); /* 뒷면이므로 뒤집어둠 */
  }

  /* ====== 각 면에 이미지 파일 지정 ====== */
  .panel-left .face.front { background-image: url('최종1.png'); }
  .panel-center .face.front { background-image: url('최종2.png'); }
  .panel-right .face.front { background-image: url('최종3.png'); }

  /* 하단 버튼 스타일 */
  .controls {
    margin-top: 40px;
    display: flex;
    gap: 16px;
    z-index: 10;
  }

  button {
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    color: white;
    background-color: #2563eb;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: background-color 0.2s;
  }
  button:hover { background-color: #1d4ed8; }
</style>
</head>
<body>

<!-- 3D 렌더링 영역 -->
<div class="scene" id="scene">
  <div class="brochure" id="brochure">
    <!-- 왼쪽 표지 (최종1.png) -->
    <div class="panel panel-left">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
    <!-- 중앙 표지 (최종2.png) -->
    <div class="panel panel-center">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
    <!-- 오른쪽 표지 (최종3.png) -->
    <div class="panel panel-right">
      <div class="face front"></div>
      <div class="face back"></div>
    </div>
  </div>
</div>

<!-- 컨트롤 버튼 -->
<div class="controls">
  <button id="btn-toggle">접기 (삼각형 만들기)</button>
  <button id="btn-auto">자동 회전 켜기</button>
</div>

<script>
  const brochure = document.getElementById('brochure');
  const scene = document.getElementById('scene');
  const btnToggle = document.getElementById('btn-toggle');
  const btnAuto = document.getElementById('btn-auto');

  let isFolded = false;
  let isAutoRotating = false;
  let rotationY = 0;
  let rotationX = -5;
  let animationFrameId;

  // 접기 / 펼치기 버튼 이벤트
  btnToggle.addEventListener('click', () => {
    isFolded = !isFolded;
    if (isFolded) {
      brochure.classList.add('is-folded');
      btnToggle.textContent = '펼치기';
    } else {
      brochure.classList.remove('is-folded');
      btnToggle.textContent = '접기 (삼각형 만들기)';
    }
  });

  // 마우스 드래그로 360도 돌려보기 기능
  let isDragging = false;
  let startX, startY;

  scene.addEventListener('mousedown', (e) => {
    if(isAutoRotating) return;
    isDragging = true;
    startX = e.clientX;
    startY = e.clientY;
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    rotationY += dx * 0.5; // 좌우 회전 속도
    rotationX -= dy * 0.5; // 상하 회전 속도
    
    // 위아래로 너무 많이 뒤집히지 않게 각도 제한 (-60도 ~ 60도)
    rotationX = Math.max(-60, Math.min(60, rotationX));

    brochure.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
    
    startX = e.clientX;
    startY = e.clientY;
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
  });
  
  // 마우스가 화면 밖으로 나갔을 때 드래그 풀림 처리
  window.addEventListener('mouseleave', () => {
    isDragging = false;
  });

  // 자동 회전 애니메이션
  function autoRotate() {
    if(isAutoRotating) {
      rotationY += 0.4; // 회전 속도
      brochure.style.transform = `rotateX(${rotationX}deg) rotateY(${rotationY}deg)`;
      animationFrameId = requestAnimationFrame(autoRotate);
    }
  }

  // 자동 회전 버튼 이벤트
  btnAuto.addEventListener('click', () => {
    isAutoRotating = !isAutoRotating;
    if(isAutoRotating) {
      btnAuto.textContent = '자동 회전 끄기';
      btnAuto.style.backgroundColor = '#059669'; // 켜졌을 때 초록색
      autoRotate();
    } else {
      btnAuto.textContent = '자동 회전 켜기';
      btnAuto.style.backgroundColor = '#2563eb'; // 꺼졌을 때 파란색
      cancelAnimationFrame(animationFrameId);
    }
  });
</script>
</body>
</html>
