-<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 인터랙티브 브로슈어</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #333;
        }

        /* 3D Scene Setup */
        #scene {
            width: 100vw;
            height: 100vh;
            perspective: 2000px; /* 3D 원근감 */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
        }

        #scene:active {
            cursor: grabbing;
        }

        /* Brochure Container */
        #brochure {
            position: relative;
            width: 280px;  /* 세로로 긴 이미지에 맞게 가로 폭 조정 */
            height: 560px; /* 세로 길이를 늘려 1:2 비율로 맞춤 */
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            transition: transform 0.1s linear;
        }

        /* Panel Common Styles */
        .panel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .center-panel {
            top: 0;
            left: 0;
            z-index: 1;
        }

        .left-panel {
            top: 0;
            left: -100%;
            transform-origin: right center; /* 오른쪽 끝을 축으로 접힘 */
        }

        .right-panel {
            top: 0;
            left: 100%;
            transform-origin: left center; /* 왼쪽 끝을 축으로 접힘 */
        }

        /* Folded States */
        /* 안쪽 내용이 바깥을 향하도록 뒤로 120도씩 접혀 삼각형(삼각기둥) 모양을 만듭니다. */
        .is-folded .right-panel {
            transform: rotateY(120deg);
        }
        
        .is-folded .left-panel {
            transform: rotateY(-120deg);
        }

        /* Brochure Faces (앞면/뒷면) */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(0,0,0,0.05);
            border-right: 1px solid rgba(0,0,0,0.05);
        }

        /* 바깥쪽 면 (이미지가 들어갈 면) */
        .face.front {
            background-color: #ffffff; 
        }

        /* 안쪽 면 (딥그린, 내용 없음) */
        .face.back {
            transform: rotateY(180deg);
            background-color: #064e3b;
        }

        /* Shadows for realistic depth */
        .face::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent, rgba(0,0,0,0.05));
            pointer-events: none;
        }

        /* UI Controls */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        button {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-inactive {
            background: rgba(255, 255, 255, 0.8);
            color: #333;
        }

        .btn-inactive:hover {
            background: #ffffff;
        }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            #brochure { transform: scale(0.8); }
        }
        @media (max-width: 768px) {
            #brochure { transform: scale(0.6); }
        }
        @media (max-width: 480px) {
            #brochure { transform: scale(0.45); }
        }
    </style>
</head>
<body>

    <!-- UI Controls -->
    <div id="controls">
        <button id="btn-unfold" class="btn-active" onclick="setFoldState(false)">펼치기</button>
        <button id="btn-fold" class="btn-inactive" onclick="setFoldState(true)">접기</button>
        <button id="btn-auto" class="btn-inactive" onclick="toggleAutoRotate()">자동 회전: 끄기</button>
    </div>

    <!-- 3D Scene -->
    <div id="scene">
        <div id="brochure">
            
            <!-- 왼쪽 패널 -->
            <div class="panel left-panel">
                <!-- 바깥쪽 면 (최종1 이미지) -->
                <div class="face front" style="background-image: url('최종1.png'); background-size: 100% 100%; background-position: center;">
                </div>
                <!-- 안쪽 면 (딥그린, 빈 화면) -->
                <div class="face back">
                </div>
            </div>

            <!-- 중앙 패널 -->
            <div class="panel center-panel">
                <!-- 바깥쪽 면 (최종2 이미지) -->
                <div class="face front" style="background-image: url('최종2.png'); background-size: 100% 100%; background-position: center;">
                </div>
                <!-- 안쪽 면 (딥그린, 빈 화면) -->
                <div class="face back">
                </div>
            </div>

            <!-- 오른쪽 패널 -->
            <div class="panel right-panel">
                <!-- 바깥쪽 면 (최종3 이미지) -->
                <div class="face front" style="background-image: url('최종3.png'); background-size: 100% 100%; background-position: center;">
                </div>
                <!-- 안쪽 면 (딥그린, 빈 화면) -->
                <div class="face back">
                </div>
            </div>

        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const brochure = document.getElementById('brochure');
        
        // 3D 회전 상태 변수
        let rotateX = -5;
        let rotateY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // 자동 회전 변수
        let autoRotate = false;
        let autoRotateSpeed = 0.3;
        let animationFrameId;

        // 드래그(마우스 및 터치) 이벤트 리스너 설정
        scene.addEventListener('mousedown', startDrag);
        scene.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);

        scene.addEventListener('touchstart', (e) => startDrag(e.touches[0]));
        scene.addEventListener('touchmove', (e) => drag(e.touches[0]));
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
            if(autoRotate) toggleAutoRotate(); // 드래그 시 자동 회전 중지
        }

        function drag(e) {
            if (!isDragging) return;
            
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };

            rotateY += deltaMove.x * 0.5;
            rotateX -= deltaMove.y * 0.5;

            // X축 회전 제한 (위아래로 너무 많이 뒤집히지 않도록)
            rotateX = Math.max(-40, Math.min(40, rotateX));

            updateTransform();

            previousMousePosition = { x: e.clientX, y: e.clientY };
        }

        function endDrag() {
            isDragging = false;
        }

        function updateTransform() {
            brochure.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        }

        // 브로슈어 접기/펼치기 제어
        function setFoldState(fold) {
            const btnUnfold = document.getElementById('btn-unfold');
            const btnFold = document.getElementById('btn-fold');

            if (fold) {
                brochure.classList.add('is-folded');
                btnFold.className = 'btn-active';
                btnUnfold.className = 'btn-inactive';
                
                // 삼각형 입체감이 한눈에 잘 보이도록 앵글 자동 보정
                rotateX = -15;
                rotateY = -45;
            } else {
                brochure.classList.remove('is-folded');
                btnUnfold.className = 'btn-active';
                btnFold.className = 'btn-inactive';
                
                // 펼칠 때 3면이 잘 보이도록 앵글 자동 보정
                rotateX = -5;
                rotateY = -15; 
            }
            updateTransform();
        }

        // 자동 회전 토글
        function toggleAutoRotate() {
            autoRotate = !autoRotate;
            const btnAuto = document.getElementById('btn-auto');
            
            if (autoRotate) {
                btnAuto.className = 'btn-active';
                btnAuto.innerText = '자동 회전: 켜짐';
                loopAutoRotate();
            } else {
                btnAuto.className = 'btn-inactive';
                btnAuto.innerText = '자동 회전: 끄기';
                cancelAnimationFrame(animationFrameId);
            }
        }

        function loopAutoRotate() {
            if (!autoRotate) return;
            rotateY += autoRotateSpeed;
            updateTransform();
            animationFrameId = requestAnimationFrame(loopAutoRotate);
        }

        // 초기 시작 앵글 설정
        updateTransform();
        
        // 페이지 로드 시 약간의 애니메이션 효과로 등장
        setTimeout(() => {
            rotateY = -15;
            updateTransform();
        }, 500);

    </script>
</body>
</html>
